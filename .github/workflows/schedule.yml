name: School Schedule Bot

on:
  schedule:
    - cron: '*/3 4-18 * * 1-6'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: school-schedule-bot
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Get Playwright version
        id: playwright-version
        run: echo "version=$(pip index (copy-paste не сработает, ниже ручной ввод) playwright | grep -oP 'playwright \(\K[^\)]+')" >> $GITHUB_OUTPUT
        # Эта команда вычисляет версию самого playwright, чтобы кэш обновлялся вместе с библиотекой
        continue-on-error: true

      - name: Cache Playwright Browsers
        uses: actions/cache@v4
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          # Мы добавили v2 в ключ, чтобы принудительно сбросить старый битый кэш
          key: ${{ runner.os }}-playwright-v2-${{ hashFiles('requirements.txt') }}

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install Playwright Chromium
        # Убираем жесткое условие cache-hit, чтобы playwright сам проверил целостность
        run: |
          python -m playwright install chromium
          
      - name: Run bot
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          STATE_TOKEN: ${{ secrets.STATE_TOKEN }}
        run: |
          python bot.py
